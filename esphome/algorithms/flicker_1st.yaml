#
# Candle Flicker effect for the main 3-LED combined light (light_main).
#
# Inputs (from velaflame.yaml):
#   id(candle_intensity)  - 0.4–1.0 wind/turbulence strength
#   id(light_main)        - the combined RGBW light (remote_values = user color/brightness)
#   id(d2_r/g/b/w) … id(d4_r/g/b/w) - per-LED hardware outputs
#
# Algorithm overview:
#   1. Brightness engine  — flicker_math::GustBrightnessEngine (gust_brightness_engine.h):
#                           slow gust layer retargets ~every 500ms with a cubic
#                           distribution for rare deep dips, plus a fast jitter layer
#                           every tick
#   2. Flame lean + color — flicker_math::render_flicker_frame() (flicker_render.h):
#                           random-walk lean angle distributes brightness across
#                           D2/D3/D4, then shifts cooler/dimmer LEDs' hue toward longer
#                           wavelengths and boosts saturation (Bezold-Brücke / Abney
#                           effects) before writing gamma-corrected output
#
# This split is what makes it easy to swap in an alternate BrightnessEngine
# while reusing the same lean/color output pipeline.

lambda:
  name: "1st flicker"
  update_interval: 50ms
  lambda: |-
    static float lean_angle = 0.0f;
    static flicker_math::GustBrightnessEngine engine;

    float wind = id(candle_intensity).state;
    float bri_mult = engine.update(wind);

    flicker_math::render_flicker_frame(
        id(light_main), lean_angle, wind, bri_mult,
        {id(d2_r), id(d2_g), id(d2_b), id(d2_w)},
        {id(d3_r), id(d3_g), id(d3_b), id(d3_w)},
        {id(d4_r), id(d4_g), id(d4_b), id(d4_w)});
