#
# Toroidal Walk flicker effect for the main 3-LED combined light (light_main):
# an alternative brightness engine that follows a 2D random walk over a
# tileable 64x64 brightness map (torus_map.h) instead of the layered
# gust/jitter model in flicker_1st.yaml. This variant keeps the optional
# random strobe dip disabled; see toroidal_walk_strobe.yaml for the
# otherwise-identical variant with it enabled.
#
# Reuses the same flame-lean / color-shift / output-writing pipeline as
# flicker_1st.yaml (flicker_render.h) -- only the brightness source differs.

lambda:
  name: "Toroidal Walk"
  update_interval: 50ms
  lambda: |-
    static float lean_angle = 0.0f;
    static flicker_math::ToroidalWalkBrightnessEngine engine;

    float wind = id(candle_intensity).state;
    engine.set_strobe_enabled(false);
    float bri_mult = engine.update(wind);

    flicker_math::render_flicker_frame(
        id(light_main), lean_angle, wind, bri_mult,
        {id(d2_r), id(d2_g), id(d2_b), id(d2_w)},
        {id(d3_r), id(d3_g), id(d3_b), id(d3_w)},
        {id(d4_r), id(d4_g), id(d4_b), id(d4_w)});
