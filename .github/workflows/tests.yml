name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run yamllint
        run: uv tool run yamllint -s .

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19

  cppcheck:
    name: C++ static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --language=c++ --std=c++14 \
            --enable=warning,performance,portability \
            --error-exitcode=1 --quiet \
            components/ esphome/algorithms/flicker_math.h

  esphome-config:
    name: ESPHome config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create dummy secrets and config overrides
        run: |
          echo 'wifi_ssid: "ci-test-network"' > secrets.yaml
          echo 'wifi_password: "ci-test-password"' >> secrets.yaml
          # Generate a valid 32-byte base64 key for CI validation
          CI_KEY=$(python3 -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())")
          sed -i "s|api_encryption_key: \"FAKE=\"|api_encryption_key: \"$CI_KEY\"|" config.yaml
          sed -i "s|ota_password: \"FAKE\"|ota_password: \"ci-test\"|" config.yaml
          sed -i "s|wifi_ap_password: \"FAKE\"|wifi_ap_password: \"ci-test-ap\"|" config.yaml
      - name: Validate ESPHome config
        run: uv tool run --from esphome esphome config config.yaml

  spdx-headers:
    name: SPDX license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers
        run: |
          missing=0
          patterns='-name *.h -o -name *.cpp -o -name *.py -o -name *.yaml'
          for f in $(find components/ esphome/ -type f \( $patterns \)); do
            if ! grep -q 'SPDX-License-Identifier' "$f"; then
              echo "Missing SPDX header: $f"
              missing=1
            fi
          done
          exit $missing

  doctest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download doctest
        run: |
          curl -sL -o tests/doctest.h \
            https://raw.githubusercontent.com/doctest/doctest/v2.4.11/doctest/doctest.h

      - name: Compile tests
        run: |
          cd tests
          g++ -std=c++14 -I../esphome/algorithms \
            test_flicker_math.cpp -o test_flicker_math
          g++ -std=c++14 -I../esphome/algorithms -Istubs \
            test_flicker_rand.cpp -o test_flicker_rand_default
          g++ -std=c++14 -I../esphome/algorithms -DVELAFLAME_BATTERY_POWERED \
            test_flicker_rand.cpp -o test_flicker_rand_battery

      - name: Run tests
        run: |
          tests/test_flicker_math
          tests/test_flicker_rand_default
          tests/test_flicker_rand_battery
